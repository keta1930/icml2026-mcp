user nginx;
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format access '$remote_addr - $request_method $uri $status $body_bytes_sent '
                      'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout access;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    keepalive_requests 100;

    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 8k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 60s;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;

    limit_conn_zone $binary_remote_addr zone=mcp_connections:1m;
    limit_conn_zone $server_name zone=mcp_global_connections:1m;
    limit_req_zone $binary_remote_addr zone=mcp_requests:10m rate=120r/m;

    upstream icml_mcp {
        server icml-mcp:20441;
        keepalive 16;
    }

    server {
        listen 20441 ssl;
        server_name icml.agent4sci.com;

        ssl_certificate /etc/letsencrypt/live/icml.agent4sci.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/icml.agent4sci.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:2m;
        ssl_session_timeout 1h;
        ssl_session_tickets off;

        if ($host != "icml.agent4sci.com") {
            return 421;
        }

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;

        location = /mcp {
            limit_conn mcp_connections 96;
            limit_conn mcp_global_connections 160;
            limit_req zone=mcp_requests burst=20 nodelay;
            limit_req_status 429;

            limit_except GET POST DELETE {
                deny all;
            }

            proxy_pass http://icml_mcp;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_send_timeout 60s;
            proxy_read_timeout 10m;

            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-ICML-Client-IP $remote_addr;
        }

        location = /health/live {
            access_log off;
            proxy_pass http://icml_mcp;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_set_header Host $http_host;
            proxy_set_header X-ICML-Client-IP $remote_addr;
        }

        location = /health/ready {
            access_log off;
            proxy_pass http://icml_mcp;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_set_header Host $http_host;
            proxy_set_header X-ICML-Client-IP $remote_addr;
        }

        location / {
            return 404;
        }
    }
}
