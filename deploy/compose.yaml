name: icml-paper-search-mcp

x-app-environment: &app-environment
  HOME: /tmp
  ICML_PAPERS_DATA_DIR: /app/data
  ICML_PAPERS_INDEX_ROOT: /var/lib/icml-paper-search/index
  ICML_PAPERS_STATE_DB_PATH: /var/lib/icml-paper-search/state/runtime.sqlite3
  ICML_PAPERS_MILVUS_URI: http://standalone:19530
  ICML_PAPERS_DASHSCOPE_API_KEY_FILE: /run/icml-runtime-secrets/dashscope_api_key
  ICML_PAPERS_SERVER_HOST: 0.0.0.0
  ICML_PAPERS_SERVER_PORT: "20441"
  ICML_PAPERS_ALLOWED_HOSTS: '${ICML_PAPERS_ALLOWED_HOSTS:-["127.0.0.1:*","localhost:*","icml-mcp:*"]}'
  ICML_PAPERS_ALLOWED_ORIGINS: '${ICML_PAPERS_ALLOWED_ORIGINS:-["http://127.0.0.1:*","http://localhost:*"]}'
  ICML_PAPERS_TRUSTED_PROXY_ENABLED: "${ICML_PAPERS_TRUSTED_PROXY_ENABLED:-false}"
  ICML_PAPERS_TRUSTED_PROXY_NETWORKS: '${ICML_PAPERS_TRUSTED_PROXY_NETWORKS:-[]}'

x-app-image: &app-image
  image: ${ICML_MCP_IMAGE:-icml-paper-search-mcp:local}
  build:
    context: ..
    dockerfile: Dockerfile

x-app-security: &app-security
  user: "0:0"
  read_only: true
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - SETGID
    - SETUID
  pids_limit: 512
  ulimits:
    nofile:
      soft: 8192
      hard: 8192

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  icml-mcp:
    <<: [*app-image, *app-security]
    container_name: icml-mcp
    environment:
      <<: *app-environment
      ICML_WRITABLE_DIRS: /var/lib/icml-paper-search/state
    depends_on:
      standalone:
        condition: service_healthy
    secrets:
      - dashscope_api_key
    volumes:
      - icml-index:/var/lib/icml-paper-search/index:ro
      - icml-state:/var/lib/icml-paper-search/state
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
      - /run/icml-runtime-secrets:rw,noexec,nosuid,nodev,size=1m,mode=0700
    networks:
      - backend
      - provider-egress
    expose:
      - "20441"
    ports:
      - "127.0.0.1:${ICML_PAPERS_APP_PORT:-20442}:20441"
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 4.0
    mem_limit: 3g
    logging: *bounded-logging
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; request = urllib.request.Request('http://127.0.0.1:20441/health/ready', headers={'Host': 'icml.agent4sci.com:20441'}); urllib.request.urlopen(request, timeout=4).read()"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  build-index:
    <<: [*app-image, *app-security]
    profiles: [build]
    environment:
      <<: *app-environment
      ICML_WRITABLE_DIRS: /var/lib/icml-paper-search/index
    depends_on:
      standalone:
        condition: service_healthy
    command:
      - icml-papers
      - build
      - --execute
      - --max-input-tokens
      - ${ICML_PAPERS_BUILD_MAX_INPUT_TOKENS:-10000000}
    secrets:
      - dashscope_api_key
    volumes:
      - icml-index:/var/lib/icml-paper-search/index
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
      - /run/icml-runtime-secrets:rw,noexec,nosuid,nodev,size=1m,mode=0700
    networks:
      - backend
      - provider-egress
    restart: "no"
    cpus: 4.0
    mem_limit: 3g
    logging: *bounded-logging
    healthcheck:
      disable: true

  icml-mcp-tls:
    image: nginx:1.29-alpine
    container_name: icml-mcp-tls
    profiles: [production]
    entrypoint: [nginx, -g, "daemon off;"]
    depends_on:
      icml-mcp:
        condition: service_healthy
    ports:
      - "${ICML_PAPERS_PUBLIC_PORT:-20441}:20441/tcp"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${ICML_PAPERS_CERT_LIVE_DIR:-/etc/letsencrypt/live/icml.agent4sci.com}:/etc/letsencrypt/live/icml.agent4sci.com:ro
      - ${ICML_PAPERS_CERT_ARCHIVE_DIR:-/etc/letsencrypt/archive/icml.agent4sci.com}:/etc/letsencrypt/archive/icml.agent4sci.com:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=8m,mode=0755
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 10s
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    logging: *bounded-logging
    healthcheck:
      test: [CMD, wget, --quiet, --no-check-certificate, "--header=Host: icml.agent4sci.com:20441", --output-document=/dev/null, https://127.0.0.1:20441/health/live]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

secrets:
  dashscope_api_key:
    file: ${ICML_PAPERS_DASHSCOPE_SECRET_FILE:-./secrets/dashscope_api_key}

volumes:
  icml-index:
  icml-state:

networks:
  backend:
  provider-egress:
