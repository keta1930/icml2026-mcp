[project]
name = "icml-paper-search-mcp"
version = "0.1.0"
description = "MCP server for deduplicated hybrid search over the ICML 2026 paper corpus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.0.0,<2",
    "dashscope>=1.24.0,<2",
    "mcp>=1.26.0",
    "pydantic>=2.11",
    "pydantic-settings>=2.12",
]

[project.scripts]
icml-paper-search-mcp = "icml_paper_search.server:main"
icml-papers = "icml_paper_search.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icml_paper_search"]

[tool.pytest.ini_options]
testpaths = ["tests"]
